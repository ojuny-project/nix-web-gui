name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build the packages and static checks
        run: |
          nix build --no-link \
            .#packages.x86_64-linux.default \
            .#packages.x86_64-linux.nix-web-gui-minimal \
            .#checks.x86_64-linux.boundaries \
            .#checks.x86_64-linux.parity \
            .#checks.x86_64-linux.minimal-flag
      - name: Rust and frontend tests
        run: |
          nix develop --command cargo test --workspace
          nix develop --command sh -c 'cd frontend && npm run check && npm run build'
