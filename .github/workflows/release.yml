name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build packages
        run: |
          nix build .#default
          mkdir -p dist/default dist/minimal
          cp -L result/bin/nix-web-gui dist/default/
          cp -rL result/share/nix-web-gui dist/default/
          nix build .#nix-web-gui-minimal
          cp -L result/bin/nix-web-gui dist/minimal/
          cp -rL result/share/nix-web-gui dist/minimal/
          tar -C dist -czf "nix-web-gui-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" default minimal
          sha256sum "nix-web-gui-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" > SHA256SUMS
      - name: Build container image
        run: |
          if nix eval --raw .#packages.x86_64-linux.container.name >/dev/null 2>&1; then
            nix build .#packages.x86_64-linux.container
            cp -L result "nix-web-gui-${GITHUB_REF_NAME}-x86_64-linux-container.tar.gz"
            sha256sum "nix-web-gui-${GITHUB_REF_NAME}-x86_64-linux-container.tar.gz" >> SHA256SUMS
          else
            echo "packages.x86_64-linux.container is not defined; skipping the container image"
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("nix-web-gui-${GITHUB_REF_NAME}-x86_64-linux.tar.gz")
          if [ -f "nix-web-gui-${GITHUB_REF_NAME}-x86_64-linux-container.tar.gz" ]; then
            assets+=("nix-web-gui-${GITHUB_REF_NAME}-x86_64-linux-container.tar.gz")
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${assets[@]}" \
            SHA256SUMS
