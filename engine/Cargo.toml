[package]
name = "nix-web-gui-engine"
version = "0.1.0"
edition = "2021"
description = "Reusable settings engine for nix-web-gui and nix-fleet-manager"
license = "GPL-3.0-or-later"

[features]
default = []
ojuny-widgets = ["nix-settings-gui/ojuny-widgets"]

[dependencies]
base64 = "0.22"
libc = "0.2"
nix-settings-gui = { path = "../../../nix-settings-gui", default-features = false }
rnix = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
